<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>GIATS Workspace</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0f18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GIATS">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root { --bg:#0a0f18; --panel:#111827; --garis:#1f2937; --teks:#e6eaf2; --teks2:#9aa4b6; --aksen:#3b82f6; --awas:#f59e0b; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--teks); font:14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  iframe { position:fixed; inset:0; width:100%; height:100%; border:0; background:var(--bg); }
  .luring { position:fixed; inset:0; display:none; overflow:auto; padding:max(24px, env(safe-area-inset-top)) 20px 32px; background:var(--bg); }
  .luring.buka { display:block; }
  .kotak { max-width:560px; margin:0 auto; }
  h1 { font-size:20px; margin:22px 0 4px; }
  p { color:var(--teks2); margin:0 0 16px; }
  .kpi { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:10px; margin:18px 0; }
  .kpi div { background:var(--panel); border:1px solid var(--garis); border-radius:14px; padding:14px; }
  .kpi b { display:block; font-size:24px; }
  .kpi span { color:var(--teks2); font-size:12px; }
  .waktu { font-size:12px; color:var(--teks2); }
  .memuat { position:fixed; inset:0; z-index:4; display:none; place-items:center; background:var(--bg); color:var(--teks2); text-align:center; font-size:13px; }
  .memuat.buka { display:grid; }
  .memuat img { width:64px; height:64px; border-radius:14px; display:block; margin:0 auto 14px; }
  button { font:inherit; font-weight:700; color:#fff; background:var(--aksen); border:0; border-radius:10px; padding:11px 18px; cursor:pointer; }
</style>
</head>
<body>
<iframe id="aplikasi" title="GIATS Workspace" allow="clipboard-write"></iframe>
<div class="memuat" id="memuat" role="status"><div><img src="ikon-192.png" alt="">Memuat GIATS Workspace…</div></div>

<section class="luring" id="luring" aria-live="polite">
  <div class="kotak">
    <img src="ikon-192.png" alt="GIATS" width="64" height="64" style="border-radius:14px;display:block">
    <h1>Sedang tidak terhubung ke internet</h1>
    <p>GIATS Workspace butuh internet untuk membuka data terbaru. Di bawah ini ringkasan terakhir yang tersimpan di perangkat ini.</p>
    <div class="kpi" id="kpi"></div>
    <div class="waktu" id="waktu"></div>
    <p style="margin-top:18px"><button type="button" id="ulang">Coba sambungkan lagi</button></p>
  </div>
</section>

<script>
(function () {
  var ALAMAT = 'https://script.google.com/macros/s/AKfycbw317e-PHzt8ODMDH6EzJVc9ID-Dzp9F1lt4JLNyr8vpqQx0B0Lt5wrdGgl-MHiPOuc/exec';
  var KUNCI = 'gw.ringkasanTerakhir', KUNCI_SESI = 'gw.sesiAplikasi', KUNCI_TANPA_KUKI = 'gw.tanpaKuki', KUNCI_LANGSUNG = 'gw.bukaLangsung';
  var $ = function (id) { return document.getElementById(id); };
  var bingkai = $('aplikasi'), dimuat = false, tunggu = null;

  var ambil = function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } };
  var taruh = function (k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} };
  var masihBerlaku = function (k, hari) { var t = Number(ambil(k) || 0); return t && Date.now() - t < hari * 864e5; };

  /* Teruskan ?app=... dari alamat PWA ke Apps Script, misalnya ./?app=roster */
  function alamatAplikasi() {
    var q = location.search && location.search.length > 1 ? location.search : '';
    return ALAMAT + q;
  }

  /* Urutan pemuatan:
   * 1. Bingkai biasa.
   * 2. Bila aplikasi tidak memberi tanda "siap" dalam 8 detik (misalnya galat Google Drive karena
   *    banyak akun Google di ponsel), bingkai dimuat ulang tanpa kuki Google (credentialless);
   *    pilihan ini diingat 30 hari.
   * 3. Bila tetap gagal dalam 15 detik, halaman pindah langsung ke alamat Apps Script (diingat 7 hari). */
  function pasangBingkai(tanpaKuki) {
    var b = document.createElement('iframe');
    b.id = 'aplikasi'; b.title = 'GIATS Workspace'; b.setAttribute('allow', 'clipboard-write');
    if (tanpaKuki) b.setAttribute('credentialless', '');
    bingkai.replaceWith(b); bingkai = b;
    b.src = alamatAplikasi();
  }
  function bukaLangsung() { taruh(KUNCI_LANGSUNG, String(Date.now())); location.replace(alamatAplikasi()); }
  function muat() {
    if (!navigator.onLine) { tampilLuring(); return; }
    if (masihBerlaku(KUNCI_LANGSUNG, 7)) { location.replace(alamatAplikasi()); return; }
    $('luring').classList.remove('buka');
    $('memuat').classList.add('buka');
    dimuat = true;
    var tanpaKuki = masihBerlaku(KUNCI_TANPA_KUKI, 30);
    pasangBingkai(tanpaKuki);
    clearTimeout(tunggu);
    if (tanpaKuki) tunggu = setTimeout(bukaLangsung, 15000);
    else tunggu = setTimeout(function () {
      taruh(KUNCI_TANPA_KUKI, String(Date.now()));
      pasangBingkai(true);
      tunggu = setTimeout(bukaLangsung, 15000);
    }, 8000);
  }

  function simpanan() { try { return JSON.parse(ambil(KUNCI) || 'null'); } catch (e) { return null; } }
  function tampilLuring() {
    var s = simpanan(), d = s && s.data;
    var baris = d ? [
      ['Karyawan aktif', d.karyawanAktif], ['Kontrak habis 30 hari', d.kontrakHabis],
      ['Invoice belum terkirim', d.invoiceMenunggu], ['Invoice bulan ini', d.invoiceBulanIni], ['Surat bulan ini', d.suratBulanIni]
    ].filter(function (x) { return x[1] != null; }) : [];
    $('kpi').innerHTML = baris.map(function (x) {
      return '<div><b>' + String(x[1]).replace(/[<>&]/g, '') + '</b><span>' + x[0] + '</span></div>';
    }).join('');
    $('waktu').textContent = s ? 'Tersimpan ' + new Date(s.pada).toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' }) : 'Ringkasan hanya tersedia setelah masuk saat online.';
    $('luring').classList.add('buka');
  }
  function lupakan() { taruh(KUNCI, null); taruh(KUNCI_SESI, null); }

  window.addEventListener('message', function (e) {
    if (!/\.googleusercontent\.com$/.test(new URL(e.origin).hostname)) return;
    var m = e.data;
    if (!m || typeof m.gw !== 'string') return;
    /* Aplikasi tampil di dalam bingkai: layar memuat ditutup dan langkah cadangan dibatalkan. */
    clearTimeout(tunggu); $('memuat').classList.remove('buka');
    if (m.gw === 'siap') {
      taruh(KUNCI_LANGSUNG, null);
      if (!m.adaSesi) {
        var s = ambil(KUNCI_SESI);
        if (s) { try { e.source.postMessage({ gw: 'sesiAwal', sesi: JSON.parse(s) }, e.origin); } catch (x) {} }
        else taruh(KUNCI, null);
      }
      return;
    }
    /* Sesi dititipkan di sini karena bingkai tanpa kuki tidak menyimpan apa pun setelah ditutup. */
    if (m.gw === 'sesi') {
      if (m.sesi && m.sesi.token) taruh(KUNCI_SESI, JSON.stringify({ token: String(m.sesi.token), nama: String(m.sesi.nama || ''), peran: String(m.sesi.peran || '') }));
      else lupakan();
      return;
    }
    /* Keluar atau sesi habis: ringkasan dan sesi titipan dihapus agar tidak tampil untuk orang lain. */
    if (m.gw === 'keluar') { lupakan(); return; }
    /* Angka ringkasan dikirim oleh beranda (tanpa nama atau nominal uang). */
    if (m.gw === 'ringkasan' && typeof m.data === 'object') taruh(KUNCI, JSON.stringify({ data: m.data, pada: m.pada || Date.now() }));
  });

  /* Saat aplikasi sudah terbuka, pemberitahuan koneksi ditangani oleh aplikasi itu sendiri. */
  window.addEventListener('offline', function () { if (!dimuat) tampilLuring(); });
  window.addEventListener('online', function () { if (!dimuat) muat(); });
  $('ulang').addEventListener('click', muat);

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
  muat();
})();
</script>
</body>
</html>
